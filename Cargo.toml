# OA Mod Launcher: Rust workspace.
#
# `crates/core` holds every rule of the launcher (signature check, download,
# unpacking, finding the game) and knows nothing about Tauri, so it is tested
# without a window. `src-tauri` is the thin shell around it.

[workspace]
resolver = "3"
members = ["crates/core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Shironex"]
repository = "https://github.com/Shironex/oa-mod-launcher"
publish = false

[workspace.dependencies]
oa-mod-launcher-core = { path = "crates/core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# `fs` and `io-util` stream a download to disk, `time` bounds a request.
tokio = { version = "1", features = ["rt", "time", "fs", "io-util", "macros"] }
# rustls instead of the system TLS library, so the behaviour is the same on
# every system. No cookies, no charset decoding, no blocking client.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "system-proxy"] }
url = "2.5"
sha2 = "0.11"
# Deflate is the only method the release zips use.
zip = { version = "9", default-features = false, features = ["deflate"] }
tempfile = "3"
# The manifest signature check. `minisign-verify` and `base64` are the crates
# and version lines `tauri-plugin-updater` verifies with, so a key pair made by
# `pnpm tauri signer generate` is read here the same way.
minisign-verify = "0.3"
base64 = "0.23"
# Tests only: signs fixtures with keys made inside the test. The 0.9 line is
# the one the Tauri CLI signs with, so the fixtures have the format of the
# real signatures.
minisign = "0.10"
# Windows only: reads where Steam is installed from the registry.
winreg = "0.56"

tauri = { version = "2.11", features = [] }
tauri-build = "2"
tauri-plugin-single-instance = "2.4"
# The folder picker. Called from Rust only: the page has no permission for it.
# Held on the 2.7 line: 2.8 needs Rust 1.90.
tauri-plugin-dialog = "~2.7"
# The launcher's own update. Pinned exactly: 2.13 needs tauri 2.12 and Rust
# 1.90, and `updater.rs` uses `configure_client`, whose argument is a type of
# the HTTP crate the plugin was built with. Without its `zip` feature: that
# one only unpacks the zipped installers of Tauri 1.
tauri-plugin-updater = { version = "=2.12.0", default-features = false, features = ["rustls-tls", "system-proxy"] }
# Named only to choose the TLS crypto provider of the process, see `run()` in
# the shell. The same crate and version line `reqwest` already brings in.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
# Exact pins: these are release candidates, and a floating one would generate
# different bindings on two machines.
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

[workspace.lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
await_holding_lock = "warn"
unwrap_used = "warn"
todo = "warn"
dbg_macro = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
panic = "abort"
